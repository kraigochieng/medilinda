name: Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    client:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            # client/.npmrc sets legacy-peer-deps (better-auth has an optional
            # sveltekit peer that conflicts with vite).
            - run: npm ci --ignore-scripts

            - run: npm test

    # The changelog is part of the merge process. The last commit of a pull request is
    # "docs: update the changelog". Run "npm run changelog" in client to make it.
    changelog:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            # The generator reads the full history and the tags.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            - run: npm ci --ignore-scripts

            - run: npm run changelog

            - name: Fail when CHANGELOG.md is not current
              run: git diff --exit-code -- ../CHANGELOG.md

    server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        env:
            # Dummy values: the tests never reach these services.
            CLIENT_URL: http://localhost:3000
            AFRICAS_TALKING_USERNAME: x
            AFRICAS_TALKING_API_KEY: x
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_INTERNAL_SECRET: test-secret
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: server/uv.lock

            - run: uv sync --group dev

            # The tests of the ML code are in server/tests/ml, so this one run tests both.
            - run: uv run pytest

            # The training module starts MLflow when it loads, so check its syntax only.
            - run: uv run python -m compileall -q src/medilinda_ml

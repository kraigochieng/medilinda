name: Docker Image CI

# Pull requests only build the image, to check that it builds. Pushes to main
# also push it to Docker Hub. Nothing here deploys: deploy the server on request
# with the Render CLI (see the README), so the plan's limits are not used up.
on:
    push:
        branches: ["main"]
        paths:
            - "server/**"
            - ".github/workflows/server-docker-image.yml"
    pull_request:
        branches: ["main"]
        paths:
            - "server/**"
            - ".github/workflows/server-docker-image.yml"
    workflow_dispatch:

# A newer run for the same branch replaces an older one that is still going.
concurrency:
    group: docker-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Only main (or a manual run) publishes the image.
            PUBLISH: ${{ github.event_name != 'pull_request' }}
        steps:
            - uses: actions/checkout@v4

            - name: Login to Docker Hub
              if: env.PUBLISH == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Get timestamp
              id: vars
              run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

            - name: Build Server Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: ./server
                  push: ${{ env.PUBLISH == 'true' }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/medilinda-server:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/medilinda-server:${{ steps.vars.outputs.ts }}

# .github/workflows/publish-to-pypi.yml

name: Upload Python Package

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    release-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11" # It's good practice to specify your version

            - name: Build release distributions
              working-directory: medilinda_ml # <<< MODIFIED: Run commands here
              run: |
                  python -m pip install build
                  python -m build

            - name: Upload distributions
              uses: actions/upload-artifact@v4
              with:
                  name: release-dists
                  path: medilinda_ml/dist/ # <<< MODIFIED: Specify the correct path

    pypi-publish:
        runs-on: ubuntu-latest
        needs:
            - release-build
        permissions:
            id-token: write
        environment:
            name: pypi
        steps:
            - name: Retrieve release distributions
              uses: actions/download-artifact@v4
              with:
                  name: release-dists
                  path: dist/

            - name: Publish release distributions to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
